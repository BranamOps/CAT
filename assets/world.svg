<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A winding dotted trail climbs through nine country lands, past a barn, windmill, pond and gate, to a red car waiting beside a warm lit door.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="45%" stop-color="#141428"/>
      <stop offset="78%" stop-color="#1f2036"/>
      <stop offset="100%" stop-color="#2a2b3f"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26304a"/>
      <stop offset="100%" stop-color="#1a2136"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f3b52"/>
      <stop offset="100%" stop-color="#20293e"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4d"/>
      <stop offset="100%" stop-color="#262a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6c667" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f6c667" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f6c667" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pond" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#5f86b8"/>
      <stop offset="100%" stop-color="#2c4a70"/>
    </radialGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f4636"/>
      <stop offset="100%" stop-color="#6d3226"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2503f"/>
      <stop offset="100%" stop-color="#a52b1f"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="1200" height="760" fill="url(#sky)"/>
  <g fill="#f6eccf" opacity="0.85">
    <circle cx="120" cy="70" r="1.8"/><circle cx="210" cy="132" r="1.3"/><circle cx="305" cy="58" r="1.6"/>
    <circle cx="380" cy="150" r="1.2"/><circle cx="470" cy="80" r="1.7"/><circle cx="545" cy="40" r="1.3"/>
    <circle cx="620" cy="120" r="1.5"/><circle cx="700" cy="66" r="1.2"/><circle cx="790" cy="140" r="1.7"/>
    <circle cx="860" cy="52" r="1.4"/><circle cx="945" cy="118" r="1.2"/><circle cx="1020" cy="70" r="1.6"/>
    <circle cx="1090" cy="150" r="1.3"/><circle cx="1150" cy="88" r="1.5"/><circle cx="640" cy="200" r="1.1"/>
    <circle cx="250" cy="205" r="1.1"/><circle cx="1000" cy="205" r="1.1"/>
  </g>
  <!-- moon -->
  <circle cx="150" cy="118" r="34" fill="#f4e7c5" opacity="0.92"/>
  <circle cx="138" cy="110" r="34" fill="#0f0f1e" opacity="0.55"/>

  <!-- distant hills -->
  <path d="M0 360 C 140 300, 260 340, 400 306 C 520 278, 620 328, 760 292 C 900 258, 1020 312, 1200 268 L1200 760 L0 760 Z" fill="url(#hillA)"/>
  <path d="M0 430 C 160 380, 300 424, 440 392 C 600 356, 720 408, 880 372 C 1010 344, 1110 392, 1200 360 L1200 760 L0 760 Z" fill="url(#hillB)"/>
  <path d="M0 540 C 180 500, 340 548, 520 516 C 700 486, 860 536, 1200 486 L1200 760 L0 760 Z" fill="url(#field)"/>

  <!-- fence along the fields -->
  <g stroke="#5b5344" stroke-width="2.5" opacity="0.8">
    <line x1="0" y1="640" x2="470" y2="612"/>
    <g>
      <line x1="60" y1="616" x2="60" y2="672"/><line x1="150" y1="611" x2="150" y2="667"/>
      <line x1="240" y1="606" x2="240" y2="662"/><line x1="330" y1="601" x2="330" y2="657"/>
      <line x1="420" y1="596" x2="420" y2="652"/>
    </g>
  </g>

  <!-- pond with reeds -->
  <ellipse cx="648" cy="628" rx="118" ry="42" fill="url(#pond)"/>
  <ellipse cx="612" cy="618" rx="46" ry="12" fill="#9dc0e6" opacity="0.35"/>
  <g stroke="#4f6b45" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="548" y1="646" x2="540" y2="606"/><line x1="566" y1="650" x2="562" y2="614"/>
    <line x1="742" y1="646" x2="750" y2="604"/><line x1="724" y1="650" x2="728" y2="612"/>
  </g>

  <!-- barn -->
  <g transform="translate(96 596)">
    <rect x="0" y="34" width="104" height="66" rx="4" fill="url(#barn)"/>
    <path d="M-8 36 L52 -6 L112 36 Z" fill="#5a291f"/>
    <rect x="40" y="60" width="26" height="40" fill="#3d1d16"/>
    <rect x="14" y="48" width="14" height="14" fill="#f6c667" opacity="0.75"/>
    <rect x="78" y="48" width="14" height="14" fill="#f6c667" opacity="0.55"/>
    <line x1="52" y1="-2" x2="52" y2="-18" stroke="#8f4636" stroke-width="3"/>
  </g>

  <!-- windmill -->
  <g transform="translate(392 396)">
    <path d="M18 132 L26 10 L46 10 L54 132 Z" fill="#7d6a53"/>
    <path d="M31 132 L36 12 L40 12 L45 132 Z" fill="#a08a6d" opacity="0.7"/>
    <g transform="translate(36 12)" stroke="#e8dcc0" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-46"/>
      <line x1="0" y1="0" x2="46" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="46"/>
      <line x1="0" y1="0" x2="-46" y2="0"/>
      <g fill="#e8dcc0" stroke="none" opacity="0.92">
        <rect x="-3" y="-14" width="6" height="28"/><rect x="-14" y="-3" width="28" height="6"/>
      </g>
    </g>
    <circle cx="36" cy="12" r="6" fill="#c9b48d"/>
    <rect x="20" y="86" width="18" height="20" rx="2" fill="#f6c667" opacity="0.5"/>
  </g>

  <!-- gate to the road out -->
  <g transform="translate(1128 236)" stroke="#c9b48d" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="78"/>
    <line x1="54" y1="0" x2="54" y2="78"/>
    <line x1="-4" y1="14" x2="58" y2="14"/>
    <line x1="-4" y1="40" x2="58" y2="40"/>
    <line x1="-4" y1="66" x2="58" y2="66"/>
  </g>
  <g transform="translate(1180 236)" stroke="#c9b48d" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="0" y1="0" x2="0" y2="78"/>
  </g>

  <!-- box tower + warm door at the goal -->
  <g transform="translate(986 62)">
    <rect x="0" y="30" width="86" height="60" rx="5" fill="#4a4258"/>
    <path d="M-6 32 L43 2 L92 32 Z" fill="#3a3346"/>
    <rect x="58" y="56" width="18" height="34" rx="2" fill="#f6c667"/>
    <g fill="#b08a5a">
      <rect x="10" y="80" width="14" height="11"/><rect x="26" y="80" width="14" height="11"/>
      <rect x="18" y="68" width="14" height="11"/><rect x="10" y="56" width="14" height="11"/>
    </g>
  </g>
  <circle cx="1034" cy="120" r="120" fill="url(#glow)"/>

  <!-- red car waiting at the end -->
  <g transform="translate(1040 132)">
    <rect x="0" y="16" width="104" height="30" rx="10" fill="url(#car)"/>
    <path d="M18 16 L34 0 L74 0 L88 16 Z" fill="#c73c2c"/>
    <path d="M26 15 L38 3 L70 3 L80 15 Z" fill="#2b3a52" opacity="0.85"/>
    <circle cx="24" cy="48" r="12" fill="#15151f"/>
    <circle cx="24" cy="48" r="5" fill="#8b8b9c"/>
    <circle cx="82" cy="48" r="12" fill="#15151f"/>
    <circle cx="82" cy="48" r="5" fill="#8b8b9c"/>
    <ellipse cx="-6" cy="24" rx="26" ry="10" fill="#f6c667" opacity="0.7"/>
  </g>

  <!-- the trail: soft underlay + dotted dashes through all 27 stones to the car -->
  <polyline points="84,661 156,638 228,661 300,631 264,593 336,570 408,593 480,562 432,524 372,502 444,479 516,502 588,471 564,433 636,410 708,433 768,395 720,357 660,334 732,312 804,334 864,296 840,258 912,236 972,213 1032,236 1080,190 1020,114"
            fill="none" stroke="#0c0c16" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <polyline points="84,661 156,638 228,661 300,631 264,593 336,570 408,593 480,562 432,524 372,502 444,479 516,502 588,471 564,433 636,410 708,433 768,395 720,357 660,334 732,312 804,334 864,296 840,258 912,236 972,213 1032,236 1080,190 1020,114"
            fill="none" stroke="#f6eccf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16" opacity="0.92"/>

  <!-- start marker: the cold alley -->
  <circle cx="84" cy="661" r="9" fill="none" stroke="#f6eccf" stroke-width="3" opacity="0.8"/>
</svg>
