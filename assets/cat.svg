<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="CAT, a stray cat with bright amber eyes">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f6c667" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#f6c667" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a63"/>
      <stop offset="100%" stop-color="#22222f"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c5c78"/>
      <stop offset="100%" stop-color="#2c2c3c"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="200" r="200" fill="url(#glow)"/>

  <!-- tail -->
  <path d="M352 350 C 420 350 436 300 414 258 C 404 238 382 240 380 258 C 378 276 396 282 404 274"
        fill="none" stroke="#2a2a3a" stroke-width="20" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="240" cy="330" rx="118" ry="106" fill="url(#fur)"/>
  <!-- chest fur -->
  <ellipse cx="240" cy="352" rx="62" ry="72" fill="url(#furLight)" opacity=".85"/>
  <!-- front legs -->
  <rect x="196" y="386" width="30" height="66" rx="15" fill="#2a2a3a"/>
  <rect x="254" y="386" width="30" height="66" rx="15" fill="#2a2a3a"/>
  <!-- head -->
  <g>
    <!-- ears -->
    <path d="M152 150 L142 66 L214 118 Z" fill="#2f2f42"/>
    <path d="M328 150 L338 66 L266 118 Z" fill="#2f2f42"/>
    <path d="M160 142 L154 88 L204 124 Z" fill="#8a5c5c" opacity=".65"/>
    <path d="M320 142 L326 88 L276 124 Z" fill="#8a5c5c" opacity=".65"/>
    <!-- skull -->
    <ellipse cx="240" cy="176" rx="96" ry="84" fill="url(#fur)"/>
    <!-- muzzle -->
    <ellipse cx="240" cy="206" rx="46" ry="34" fill="url(#furLight)"/>
    <!-- eyes -->
    <g>
      <ellipse cx="206" cy="164" rx="24" ry="27" fill="#f6c667"/>
      <ellipse cx="274" cy="164" rx="24" ry="27" fill="#f6c667"/>
      <ellipse cx="206" cy="164" rx="6" ry="22" fill="#191922"/>
      <ellipse cx="274" cy="164" rx="6" ry="22" fill="#191922"/>
      <circle cx="213" cy="152" r="6" fill="#fff8e2" opacity=".95"/>
      <circle cx="281" cy="152" r="6" fill="#fff8e2" opacity=".95"/>
    </g>
    <!-- nose + mouth -->
    <path d="M240 194 l-11 12 h22 z" fill="#c9899a"/>
    <path d="M240 206 v10 M240 216 c-8 8 -20 8 -26 0 M240 216 c8 8 20 8 26 0"
          fill="none" stroke="#191922" stroke-width="4" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#cfc9dd" stroke-width="3" stroke-linecap="round" opacity=".75">
      <path d="M188 200 L120 188"/>
      <path d="M188 212 L118 216"/>
      <path d="M292 200 L360 188"/>
      <path d="M292 212 L362 216"/>
    </g>
  </g>
</svg>
